name: Docker Build & Push

on:
  push:
    tags:
      - 'build-and-push'
      - 'build-and-push-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (leave empty to use commit sha)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  REGISTRY_IMAGE: logtaha/vigo-user-service
  REGISTRY_NAME: Docker Hub

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Resolve Docker Image Tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          LC_ALL: C
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo "${GITHUB_SHA::7}")"
          RAW_COMMIT_MSG="$(git log -1 --pretty=%s 2>/dev/null || echo 'N/A')"
          CLEAN_COMMIT_MSG="$(printf '%s' "$RAW_COMMIT_MSG" | tr '\n\r|"' ' ')"

          IS_VERSIONED="false"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CLEAN_INPUT="${INPUT_TAG#"${INPUT_TAG%%[![:space:]]*}"}"
            CLEAN_INPUT="${CLEAN_INPUT%"${CLEAN_INPUT##*[![:space:]]}"}"
            if [ -n "$CLEAN_INPUT" ]; then
              IMAGE_TAG="$CLEAN_INPUT"
              IS_VERSIONED="true"
            else
              IMAGE_TAG="sha-${SHORT_SHA}"
              IS_VERSIONED="false"
            fi
            TRIGGER_TYPE="Manual Dispatch"
            GIT_TAG="N/A"
          else
            RAW_REF="$GITHUB_REF_NAME"
            PREFIX="build-and-push-"
            if [ "$RAW_REF" = "build-and-push" ] || [ "$RAW_REF" = "build-and-push-" ]; then
              IMAGE_TAG="sha-${SHORT_SHA}"
              IS_VERSIONED="false"
            elif [[ "$RAW_REF" == "$PREFIX"* ]]; then
              EXTRACTED="${RAW_REF#$PREFIX}"
              if [ -n "$EXTRACTED" ]; then
                IMAGE_TAG="$EXTRACTED"
                IS_VERSIONED="true"
              else
                IMAGE_TAG="sha-${SHORT_SHA}"
                IS_VERSIONED="false"
              fi
            else
              IMAGE_TAG="$RAW_REF"
              IS_VERSIONED="true"
            fi
            TRIGGER_TYPE="Git Tag"
            GIT_TAG="$RAW_REF"
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag. Use 1 to 128 letters, digits, underscores, periods, or hyphens. Start with a letter, digit, or underscore." >&2
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "is_versioned=$IS_VERSIONED" >> "$GITHUB_OUTPUT"
          echo "trigger_type=$TRIGGER_TYPE" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$CLEAN_COMMIT_MSG" >> "$GITHUB_OUTPUT"

          # Provide newline-delimited tags to docker/build-push-action
          echo "docker_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${REGISTRY_IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          if [ "$IS_VERSIONED" = "true" ] && [ "$IMAGE_TAG" != "latest" ]; then
            echo "${REGISTRY_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "Successfully resolved tags:"
          echo "  Trigger: $TRIGGER_TYPE"
          echo "  Git Tag: $GIT_TAG"
          echo "  Image Tag: $IMAGE_TAG"
          echo "  Is Versioned Release: $IS_VERSIONED"
          if [ "$IS_VERSIONED" = "true" ] && [ "$IMAGE_TAG" != "latest" ]; then
            echo "  Target Tags: ${REGISTRY_IMAGE}:${IMAGE_TAG}, ${REGISTRY_IMAGE}:latest"
          else
            echo "  Target Tags: ${REGISTRY_IMAGE}:${IMAGE_TAG}"
          fi

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        id: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Maven settings for GitHub Packages
        id: prepare_maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME || vars.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        shell: bash
        run: |
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          username = os.environ["MAVEN_USERNAME"]
          token = os.environ["MAVEN_TOKEN"]
          if not username or not token:
              raise SystemExit("Set MAVEN_USERNAME and make the MAVEN_TOKEN secret available to this repository.")

          settings = ET.Element("settings")
          server = ET.SubElement(ET.SubElement(settings, "servers"), "server")
          ET.SubElement(server, "id").text = "github-vigo-contracts"
          ET.SubElement(server, "username").text = username
          ET.SubElement(server, "password").text = token
          ET.ElementTree(settings).write(Path(os.environ["RUNNER_TEMP"]) / "maven-settings.xml", encoding="utf-8")
          PY

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secret-files: maven_settings=${{ runner.temp }}/maven-settings.xml
          tags: ${{ steps.resolve_tag.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Job Summary
        id: summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ steps.resolve_tag.outputs.trigger_type }}
          GIT_TAG: ${{ steps.resolve_tag.outputs.git_tag }}
          IS_VERSIONED: ${{ steps.resolve_tag.outputs.is_versioned || 'false' }}
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.image_tag }}
          SHORT_SHA: ${{ steps.resolve_tag.outputs.short_sha }}
          COMMIT_MSG: ${{ steps.resolve_tag.outputs.commit_msg || 'N/A' }}
          DIGEST: ${{ steps.build_push.outputs.digest || 'N/A' }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RESOLVE_TAG_OUTCOME: ${{ steps.resolve_tag.outcome }}
          BUILDX_OUTCOME: ${{ steps.setup_buildx.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          MAVEN_OUTCOME: ${{ steps.prepare_maven.outcome }}
          BUILD_PUSH_OUTCOME: ${{ steps.build_push.outcome }}
        shell: bash
        run: |
          if [ -z "$TRIGGER" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              TRIGGER="Manual Dispatch"
            else
              TRIGGER="Git Tag"
            fi
          fi

          if [ -z "$GIT_TAG" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              GIT_TAG="$GITHUB_REF_NAME"
            else
              GIT_TAG="N/A"
            fi
          fi

          DOCKERHUB_URL="https://hub.docker.com/r/${REGISTRY_IMAGE}"

          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="N/A"
            TAGS_DISPLAY="*N/A*"
            IMAGES_MD="*N/A*"
          elif [ "$IS_VERSIONED" = "true" ] && [ "$IMAGE_TAG" != "latest" ]; then
            TAGS_DISPLAY="\`$IMAGE_TAG\` *(also tagged as \`latest\`)*"
            IMAGES_MD="[\`${REGISTRY_IMAGE}:${IMAGE_TAG}\`]($DOCKERHUB_URL)<br>[\`${REGISTRY_IMAGE}:latest\`]($DOCKERHUB_URL)"
          else
            TAGS_DISPLAY="\`$IMAGE_TAG\`"
            IMAGES_MD="[\`${REGISTRY_IMAGE}:${IMAGE_TAG}\`]($DOCKERHUB_URL)"
          fi

          SHORT_SHA="${SHORT_SHA:-${GITHUB_SHA::7}}"
          REPO="$GITHUB_REPOSITORY"
          COMMIT_URL="${GITHUB_SERVER_URL}/${REPO}/commit/${GITHUB_SHA}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_BADGE="✅ Success"
            BUILD_STATUS="✅ Success"
            PUSH_STATUS="✅ Success"
            HEADER="# 🚀 Docker Build & Push"
          else
            STATUS_BADGE="❌ Failed"
            HEADER="# ❌ Docker Build & Push Failed"

            if [ "$BUILD_PUSH_OUTCOME" = "success" ]; then
              BUILD_STATUS="✅ Success"
              PUSH_STATUS="✅ Success"
            elif [ "$BUILD_PUSH_OUTCOME" = "failure" ]; then
              BUILD_STATUS="❌ Failed"
              PUSH_STATUS="❌ Failed"
            else
              BUILD_STATUS="⏭️ Skipped"
              PUSH_STATUS="⏭️ Skipped"
            fi

            FAILED_STEP="Unknown"
            if [ "$CHECKOUT_OUTCOME" = "failure" ]; then
              FAILED_STEP="Checkout repository"
            elif [ "$RESOLVE_TAG_OUTCOME" = "failure" ]; then
              FAILED_STEP="Resolve Docker Image Tag"
            elif [ "$BUILDX_OUTCOME" = "failure" ]; then
              FAILED_STEP="Set up Docker Buildx"
            elif [ "$LOGIN_OUTCOME" = "failure" ]; then
              FAILED_STEP="Log in to Docker Hub"
            elif [ "$MAVEN_OUTCOME" = "failure" ]; then
              FAILED_STEP="Prepare Maven settings for GitHub Packages"
            elif [ "$BUILD_PUSH_OUTCOME" = "failure" ]; then
              FAILED_STEP="Build and push Docker image"
            fi
          fi

          {
            echo "$HEADER"
            echo ""
            echo "## 📊 Execution Status"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| **Status** | $STATUS_BADGE |"
            echo "| **Trigger** | $TRIGGER |"
            if [ "$TRIGGER" = "Git Tag" ]; then
              echo "| **Git Tag** | \`$GIT_TAG\` |"
            else
              echo "| **Manual Input Tag** | \`$IMAGE_TAG\` |"
            fi
            echo "| **Image Tag(s)** | $TAGS_DISPLAY |"
            echo "| **Repository** | \`$REPO\` |"
            echo "| **Branch / Ref** | \`$GITHUB_REF_NAME\` |"
            echo "| **Commit** | [\`$SHORT_SHA\`]($COMMIT_URL) |"
            echo "| **Commit SHA (Full)** | \`$GITHUB_SHA\` |"
            echo "| **Commit Message** | $COMMIT_MSG |"
            echo "| **Actor** | \`$GITHUB_ACTOR\` |"
            echo "| **Workflow Run Number** | # $GITHUB_RUN_NUMBER |"
            echo "| **Workflow Run ID** | [\`$GITHUB_RUN_ID\`]($RUN_URL) |"
            if [ "$JOB_STATUS" != "success" ]; then
              echo "| **Failed Step** | ⚠️ \`$FAILED_STEP\` |"
            fi
            echo ""
            echo "## 🐳 Docker Image"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| **Images** | $IMAGES_MD |"
            echo "| **Registry** | $REGISTRY_NAME |"
            echo "| **Build** | $BUILD_STATUS |"
            echo "| **Push** | $PUSH_STATUS |"
            if [ "$DIGEST" != "N/A" ]; then
              echo "| **Digest** | \`$DIGEST\` |"
            else
              echo "| **Digest** | *N/A (Build/Push did not complete)* |"
            fi
            echo ""
            echo "## 🔗 Links"
            echo ""
            echo "- 📝 [Commit Details ($SHORT_SHA)]($COMMIT_URL)"
            echo "- ⚙️ [GitHub Actions Run # $GITHUB_RUN_NUMBER]($RUN_URL)"
            echo "- 📦 [Docker Hub Repository ($REGISTRY_IMAGE)]($DOCKERHUB_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
